services:
  # API 服務
  - type: web
    name: ai-survey-api
    runtime: docker
    repo: https://github.com/kellychenichun-glitch/ai-survey-system2026
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-survey-postgres
          property: connectionString
      - key: CLAUDE_API_KEY
        sync: false

databases:
  # PostgreSQL 資料庫
  - name: ai-survey-postgres
    databaseName: aisurvey
    user: aisurvey
    plan: free
